<svg xmlns="http://www.w3.org/2000/svg" width="720" height="164" viewBox="0 0 720 164">
  <title>Responsive, accessible and inclusive web interfaces</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .line { animation: reveal 1.25s ease-out both; transform-origin: 46px 119px; }
      .dot { animation: arrive 0.65s ease-out both; }
      .second { animation-delay: 0.12s; }
      .third { animation-delay: 0.24s; }
    }
    @keyframes reveal { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#183048"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="718" height="162" rx="20" fill="url(#background)" stroke="#35516b" stroke-width="2"/>
  <circle class="dot" cx="47" cy="47" r="4" fill="#67e8f9"/>
  <circle class="dot second" cx="61" cy="47" r="4" fill="#a5b4fc"/>
  <circle class="dot third" cx="75" cy="47" r="4" fill="#7dd3fc"/>
  <text x="46" y="92" fill="#f1f5f9" font-family="monospace" font-size="23">Responsive · Accessible · Inclusive</text>
  <rect class="line" x="46" y="117" width="180" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
